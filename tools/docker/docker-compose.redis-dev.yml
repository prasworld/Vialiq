# ==============================================================================
# Vialiq EDC — Redis High-Availability Cluster Topology (Docker Compose)
# ==============================================================================
# Architecture:
#   - Primary (Master):      Port 6379  | Handles writes (locks, cache invalidations)
#   - Replica (Secondary):   Port 6380  | Streaming async replication (PSYNC), auto-promotes
#   - Sentinel 1:            Port 26379 | Quorum = 2, down-after = 2000ms
#   - Sentinel 2:            Port 26380 | Quorum = 2, down-after = 2000ms
#   - Sentinel 3:            Port 26381 | Quorum = 2, down-after = 2000ms
#
# Standards & References:
#   - ADR 007-A: Multi-Tenant Cache Isolation & Security Scoping
#   - ENG 007-B: High-Availability Redis Cluster Architecture & Scaling Guide
#
# Operational Commands:
#   - Start HA Cluster:         npm run docker:redis:up
#                               (or docker compose -f tools/docker/docker-compose.redis-dev.yml up -d)
#   - View Cluster Status:      npm run docker:redis:status
#   - Stop Cluster:             npm run docker:redis:stop
#   - Tear Down:                npm run docker:redis:down
#   - Run Chaos Failover Drill: npm run docker:redis:test-failover
#                               (or bash tools/scripts/test-redis-ha-failover.sh)
# ==============================================================================

services:
  # 1. Primary Redis Node
  redis-primary:
    image: redis:7.2-alpine
    container_name: vialiq-redis-primary
    command: >
      redis-server
      --port 6379
      --requirepass VialiqDevSecret123!
      --masterauth VialiqDevSecret123!
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VialiqDevSecret123!", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - vialiq-dev-net

  # 2. Secondary Redis Replica
  redis-replica:
    image: redis:7.2-alpine
    container_name: vialiq-redis-replica
    command: >
      redis-server
      --port 6380
      --replicaof redis-primary 6379
      --requirepass VialiqDevSecret123!
      --masterauth VialiqDevSecret123!
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    ports:
      - "6380:6380"
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "VialiqDevSecret123!", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - vialiq-dev-net

  # 3. Sentinel 1
  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: vialiq-sentinel-1
    command: >
      sh -c "echo 'port 26379' > /tmp/sentinel.conf &&
             echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
             echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
             echo 'sentinel monitor mymaster redis-primary 6379 2' >> /tmp/sentinel.conf &&
             echo 'sentinel auth-pass mymaster VialiqDevSecret123!' >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26379:26379"
    depends_on:
      - redis-primary
      - redis-replica
    networks:
      - vialiq-dev-net

  # 4. Sentinel 2
  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: vialiq-sentinel-2
    command: >
      sh -c "echo 'port 26380' > /tmp/sentinel.conf &&
             echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
             echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
             echo 'sentinel monitor mymaster redis-primary 6379 2' >> /tmp/sentinel.conf &&
             echo 'sentinel auth-pass mymaster VialiqDevSecret123!' >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26380:26380"
    depends_on:
      - redis-primary
      - redis-replica
    networks:
      - vialiq-dev-net

  # 5. Sentinel 3
  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: vialiq-sentinel-3
    command: >
      sh -c "echo 'port 26381' > /tmp/sentinel.conf &&
             echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
             echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
             echo 'sentinel monitor mymaster redis-primary 6379 2' >> /tmp/sentinel.conf &&
             echo 'sentinel auth-pass mymaster VialiqDevSecret123!' >> /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26381:26381"
    depends_on:
      - redis-primary
      - redis-replica
    networks:
      - vialiq-dev-net

networks:
  vialiq-dev-net:
    driver: bridge
