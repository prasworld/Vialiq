# ==============================================================================
# Vialiq EDC — Lightweight Standalone Redis (Docker Compose)
# ==============================================================================
# Purpose:
#   Fast, minimal single-node Redis instance for local feature development
#   (ASP.NET Core Web API, Angular UI, distributed locking, caching, and auth sessions).
#
# Ports:
#   - 6379:6379 (Standard Redis Port)
#
# Credentials (12-Factor Environment Secret with Safe Dev Fallback):
#   - Default: VialiqDevSecret123!
#   - Override: export VIALIQ_REDIS_PASSWORD="YourCustomSecret"
#
# Connection Strings:
#   - Host connection: localhost:6379,password=VialiqDevSecret123!
#
# For High-Availability, Replication, and Sentinel Chaos Failover Drills:
#   - Use: tools/docker/docker-compose.redis-ha.yml
#   - Command: npm run docker:redis:ha
# ==============================================================================

services:
  redis:
    image: redis:7.2-alpine
    container_name: vialiq-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --port 6379
      --requirepass ${VIALIQ_REDIS_PASSWORD:-VialiqDevSecret123!}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - vialiq-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VIALIQ_REDIS_PASSWORD:-VialiqDevSecret123!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  vialiq-dev-net:
    name: vialiq-dev-net
    driver: bridge

volumes:
  redis_dev_data:
    name: vialiq_redis_dev_data

