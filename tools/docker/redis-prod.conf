# ==============================================================================
# VIALIQ CLINICAL PLATFORM - PRODUCTION HARDENED REDIS CONFIGURATION (redis.conf)
# Standards: FDA 21 CFR Part 11 § 11.10(a),(e); HIPAA § 164.312; GAMP 5 Cat 4
# Target Architecture: ADR 007-A / ENG-007-B
# ==============================================================================

# --- NETWORK & SECURITY ---
# Restrict to trusted loopback interfaces by default. This ensures Redis never opens
# unauthenticated network listeners to remote actors if started without credentials.
# In production private VPCs or container overlays, operators explicitly bind to trusted
# private interfaces alongside mandatory credentials or ACLs via startup arguments:
#   redis-server /path/to/redis-prod.conf --bind <trusted-private-ip> 127.0.0.1 --requirepass "$VIALIQ_REDIS_PASSWORD" --masterauth "$VIALIQ_REDIS_PASSWORD"
bind 127.0.0.1 -::1
protected-mode yes
port 6379
timeout 300
tcp-keepalive 60

# NOTE: The redis.conf parser does NOT perform shell environment variable expansion (${VAR}).
# In production, pass credentials and network bindings at startup via command-line arguments
# to keep secrets out of static files and ensure only authenticated clients on trusted subnets can connect:
#   redis-server /path/to/redis-prod.conf --bind <trusted-private-ip> 127.0.0.1 --requirepass "$VIALIQ_REDIS_PASSWORD" --masterauth "$VIALIQ_REDIS_PASSWORD"
# Or configure a Redis 7.2 ACL file:
#   aclfile /etc/redis/users.acl

# --- MEMORY LIMITS & GxP EVICTION POLICY ---
# Starter 2 GB baseline (scale instance maxmemory to 4-64 GB non-clustered 1P+2R Sentinel HA per Scale 004; trigger alert at 75% usage)
maxmemory 2147483648

# CRITICAL GxP COMPLIANCE RULE:
# NEVER use allkeys-lru or allkeys-random.
# Store Reference Dictionaries (MedDRA, WHODrug), Governance Lock hashes (vialiq:locks:*), and Epoch counters WITHOUT TTL.
# Keep ephemera (15m edit leases, JWT revocations, 60s negative sentinels, 1h/24h [Cached] views) WITH TTLs so volatile-lru
# ONLY evicts expiring cache items and can NEVER silently drop invariant dictionaries or governance state.
maxmemory-policy volatile-lru

# --- REPLICATION & FAILOVER DURABILITY ---
# Note on Failover & Lock Durability (ADR 003 Decision 7):
# Redis PSYNC replication is asynchronous. In the event of primary crash before replication reaches
# the promoted replica, edit locks are protected by Tier 1 MongoDB canonical leases (study_edit_leases)
# and clinical entity mutations enforce monotonic fencing tokens (_version OCC) to prevent stale overwrites.
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-backlog-size 64mb
repl-backlog-ttl 3600

# Require at least 1 healthy replica connected with lag <= 10s before master accepts writes
# Prevents split-brain data divergence during network partitions
min-replicas-to-write 1
min-replicas-max-lag 10

# --- PERSISTENCE (Append-Only File for Disaster Recovery) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# GxP Durability Invariant:
# Set to 'no' so Redis continues issuing 1-second fsyncs even during background AOF rewrites (BGREWRITEAOF).
# Setting 'yes' suppresses fsync during rewrites, allowing up to 30s of dirty-buffer loss if a host crashes.
# On modern SSD/NVMe volumes, concurrent fsync causes negligible latency variance, capping crash loss at <= 1s.
# Note: Canonical durability for governance locks is backed by MongoDB study_locks (Tier 1 ACID majority write).
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- PERFORMANCE & MONITORING ---
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
