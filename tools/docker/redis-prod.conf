# ==============================================================================
# VIALIQ CLINICAL PLATFORM - PRODUCTION HARDENED REDIS CONFIGURATION (redis.conf)
# Standards: FDA 21 CFR Part 11 § 11.10(a),(e); HIPAA § 164.312; GAMP 5 Cat 4
# Target Architecture: ADR 007-A / ENG-007-B
# ==============================================================================

# --- NETWORK & SECURITY ---
bind 0.0.0.0
protected-mode yes
port 6379
requirepass "${VIALIQ_REDIS_PASSWORD}"
masterauth "${VIALIQ_REDIS_PASSWORD}"
timeout 300
tcp-keepalive 60

# --- MEMORY LIMITS & GxP EVICTION POLICY ---
# Starter 2 GB baseline (scale instance maxmemory to 4-64 GB non-clustered 1P+2R Sentinel HA per Scale 004; trigger alert at 75% usage)
maxmemory 2147483648

# CRITICAL GxP COMPLIANCE RULE:
# NEVER use allkeys-lru or allkeys-random.
# Store Reference Dictionaries (MedDRA, WHODrug), Governance Lock hashes (vialiq:locks:*), and Epoch counters WITHOUT TTL.
# Keep ephemera (15m edit leases, JWT revocations, 60s negative sentinels, 1h/24h [Cached] views) WITH TTLs so volatile-lru
# ONLY evicts expiring cache items and can NEVER silently drop invariant dictionaries or governance state.
maxmemory-policy volatile-lru

# --- REPLICATION & FAILOVER DURABILITY ---
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-backlog-size 64mb
repl-backlog-ttl 3600

# Require at least 1 healthy replica connected with lag <= 10s before master accepts writes
# Prevents split-brain data divergence during network partitions
min-replicas-to-write 1
min-replicas-max-lag 10

# --- PERSISTENCE (Append-Only File for Disaster Recovery) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- PERFORMANCE & MONITORING ---
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
