  vialiq-mongo-prod-net:
    name: vialiq-mongo-prod-net
    driver: bridge

volumes:
  mongo_admin_data:
    name: vialiq_mongo_admin_data
  mongo_dev_data:
    name: vialiq_mongo_dev_data
  mongo_prod_data:
