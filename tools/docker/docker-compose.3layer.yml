# ==============================================================================
# Vialiq EDC — 3-Layer MongoDB Cluster Topology (Docker Compose)
# ==============================================================================
# Architecture:
#   Layer 1 (Admin):   Port 27017 | Replica Set: rs-admin | Control Plane (Zero clinical data)
#   Layer 2 (Dev/UAT): Port 27027 | Replica Set: rs-dev   | Not-Live Study Databases
#   Layer 3 (Prod):    Port 27037 | Replica Set: rs-prod  | Live GxP Clinical Trials
#
# Host Connection Strings (Full Replica Set discovery without directConnection=true):
#   - Layer 1 Admin: mongodb://localhost:27017/?replicaSet=rs-admin
#   - Layer 2 Dev:   mongodb://localhost:27027/?replicaSet=rs-dev
#   - Layer 3 Prod:  mongodb://localhost:27037/?replicaSet=rs-prod
#
# Hardware Targets:
#   - Apple Silicon M1 Pro / M2 / M3 / M4 / M5 Pro (ARM64 native)
#   - Memory optimized: WiredTiger cache clamped to 512MB per layer
#
# Profiles (Phased Activation):
#   - Phase 1 (Admin only):     docker compose -f tools/docker/docker-compose.3layer.yml --profile admin up -d
#   - Phase 2 (Admin + Dev):    docker compose -f tools/docker/docker-compose.3layer.yml --profile dev-phase up -d
#   - Phase 3 (Prod only):      docker compose -f tools/docker/docker-compose.3layer.yml --profile prod up -d
#   - All 3 Layers (Full):      docker compose -f tools/docker/docker-compose.3layer.yml --profile all up -d
#
# ─── HA Scaling (future — 1 primary + 2 secondaries per layer) ─────────────
#  1. Uncomment the secondary services and their volumes at the bottom.
#  2. In each init-layer*-* service: replace the single localhost member
#     with the commented 3-member block using Docker service names.
#  3. Switch to the shared network anchor pattern if host-side RS discovery is
#     needed across multi-container topologies.
#     See: docs/backend-architecture/database/mongodb-3layer-docker-setup-guide.md
# ==============================================================================

services:
  # ============================================================================
  # LAYER 1: ADMIN LAYER (Cluster 0 — Centralized Control Plane)
  # ============================================================================
  mongo-layer1-admin:
    image: mongo:7.0
    container_name: vialiq-mongo-layer1-admin
    restart: unless-stopped
    profiles: ["admin", "dev-phase", "all"]
    command: [
      "mongod",
      "--replSet", "rs-admin",
      "--bind_ip_all",
      "--port", "27017",
      "--wiredTigerCacheSizeGB", "0.5"
    ]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_admin_data:/data/db
    networks:
      - vialiq-mongo-admin-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.hello().isWritablePrimary || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── HA secondaries for rs-admin (uncomment to enable 3-node HA) ───────────
  # mongo-layer1-admin-2:
  #   image: mongo:7.0
  #   container_name: vialiq-mongo-layer1-admin-2
  #   restart: unless-stopped
