    networks:
      - vialiq-mongo-dev-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27027", "--quiet", "--eval", "db.hello().isWritablePrimary || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── HA secondaries for rs-dev (uncomment to enable 3-node HA) ─────────────
