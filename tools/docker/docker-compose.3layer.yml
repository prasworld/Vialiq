  #   restart: unless-stopped
  #   profiles: ["prod", "all"]
  #   command: [
  #     "mongod",
  #     "--replSet", "rs-prod",
  #     "--bind_ip_all",
  #     "--port", "27037",
  #     "--wiredTigerCacheSizeGB", "0.5"
  #   ]
  #   ports:
  #     - "127.0.0.1:27039:27037"
  #   volumes:
  #     - mongo_prod_3_data:/data/db
  #   networks:
