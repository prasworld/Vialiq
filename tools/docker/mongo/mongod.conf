# ==============================================================================
# Vialiq EDC — MongoDB 7.0 Configuration Template
# Optimized for Apple Silicon M1 Pro / M5 Pro Local Development
# ==============================================================================

# Network Interfaces
net:
  port: 27017
  bindIpAll: true
  maxIncomingConnections: 1000

# Storage Engine (WiredTiger)
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      # Clamp cache to 512MB per layer to allow all 3 layers to run concurrently
      # on Apple Silicon (M1 Pro / M5 Pro) without memory contention
      cacheSizeGB: 0.5

# Replication Configuration (Required for ACID Transactions & Change Streams)
replication:
  replSetName: rs-admin

# System Logging
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
