name: Publish Packages

on:
  push:
    branches: [master]
    # Runs once per PR merge to master.
    # git.commit: false means no version-bump commit is pushed back, so there
    # is no infinite-loop risk and no need for [skip ci].
  workflow_dispatch:
    # Manual trigger for recovery (e.g. tags pushed but npm publish failed,
    # or vice-versa). nx release version is a no-op when there are no new
    # bumping commits since the last tag.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push annotated git tags
      id-token: write   # npm Trusted Publishing (OIDC provenance)

    steps:
      - uses: actions/checkout@v5.0.1
        with:
          # Using a PAT allows pushing version commits and tags past branch protection 
          # and ensures downstream workflows are triggered.
          # We keep persist-credentials=false so the PAT is not left in git config
          # for subsequent steps or third-party actions.
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          fetch-depth: 0   # full history so nx can walk back to the last release tag

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships with npm >= 11.11.0, required for OIDC provenance.
          # setup-node@v5+ required: v4 writes always-auth=true which npm 11 rejects.
          # Do NOT set registry-url here: setup-node would write an _authToken
          # placeholder to .npmrc that npm 11 treats as token auth, breaking OIDC.
          node-version: '24'
          cache: 'npm'

      - name: Enable Corepack
        run: |
          corepack enable npm
          corepack install

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Configure git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # Snapshot on-disk versions before versioning so we can detect which
      # projects were actually bumped (avoids publishing already-live versions).
      - name: Snapshot pre-version state
        run: |
          node -e "
            const fs = require('fs');
            const nx = JSON.parse(fs.readFileSync('nx.json', 'utf8'));
            const libs = nx.release.projects;
            const v = {};
            for (const l of libs) {
              try { v[l] = JSON.parse(fs.readFileSync('libs/' + l + '/package.json', 'utf8')).version; }
              catch (e) { v[l] = ''; }
            }
            fs.writeFileSync('/tmp/pre-versions.json', JSON.stringify(v));
            console.log('Pre-version snapshot:', JSON.stringify(v));
          "

      # Purge any local tags that no longer exist on the remote (can be left
      # behind if a previous run created tags but failed before pushing them).
      # This prevents nx release version from seeing a stale local tag as the
      # current version and accidentally skipping a version number.
      - name: Prune orphan local tags
        run: git fetch origin --prune '+refs/tags/*:refs/tags/*'

      # Parse conventional commits since each project's last git tag and bump
      # package.json + create a local annotated git tag for each changed project.
      # Commit types: feat -> minor, fix/refactor/perf -> patch, chore/docs -> no-op.
      # Projects with no new bumping commits are skipped automatically.
      - name: Version packages
        run: npx nx release version

      # Compare on-disk versions to determine which projects were bumped.
      # Only those projects need to be built and published.
      - name: Find bumped projects
        id: bumped
        run: |
          node -e "
            const fs = require('fs');
            const pre = JSON.parse(fs.readFileSync('/tmp/pre-versions.json', 'utf8'));
            const nx = JSON.parse(fs.readFileSync('nx.json', 'utf8'));
            const libs = nx.release.projects;
            const bumped = [];
            for (const l of libs) {
              const cur = JSON.parse(fs.readFileSync('libs/' + l + '/package.json', 'utf8')).version;
              if (cur !== pre[l]) bumped.push(l);
            }
            const out = bumped.join(',');
            console.log('Bumped projects: ' + (out || '(none)'));
            fs.appendFileSync(process.env.GITHUB_ENV, 'BUMPED_LIBS=' + out + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_bumps=' + (bumped.length > 0 ? 'true' : 'false') + '\n');
          "

      # Build only the bumped libraries (minified, no source maps).
      # Each postbuild-publish target depends on build automatically.
      - name: Build bumped packages
        if: steps.bumped.outputs.has_bumps == 'true'
        run: npx nx run-many -t postbuild-publish -p ${{ env.BUMPED_LIBS }} --configuration=production --parallel=false

      # Publish each bumped library's dist folder to the npm registry with
      # provenance attestation via OIDC (requires id-token: write above).
      - name: Publish packages
        if: steps.bumped.outputs.has_bumps == 'true'
        run: npx nx release publish -p ${{ env.BUMPED_LIBS }}
        env:
          NPM_CONFIG_PROVENANCE: true

      # Push ONLY the annotated tags created in this run (one per bumped project).
      # Pushing 'git push origin --tags' would push every local tag, which could
      # include orphan tags left by an earlier run on a reused runner.
      # Tags follow the nx release pattern: <projectName>@<version>
      # (e.g. flux-ui@0.0.5 — the Nx project name, not the npm package name).
      #
      # Manual recovery if this step fails after a successful npm publish:
      #   git push origin <projectName>@<version>  # for each affected project
      # e.g.: git push origin flux-ui@0.0.5
      - name: Push release tags
        if: steps.bumped.outputs.has_bumps == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          trap 'git remote set-url origin https://github.com/${{ github.repository }}.git' EXIT
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const bumped = process.env.BUMPED_LIBS.split(',').filter(Boolean);
            for (const lib of bumped) {
              const pkg = JSON.parse(fs.readFileSync('libs/' + lib + '/package.json', 'utf8'));
              const tag = lib + '@' + pkg.version;
              console.log('Pushing tag: ' + tag);
              execSync('git push origin refs/tags/' + tag, { stdio: 'inherit' });
            }
          "
