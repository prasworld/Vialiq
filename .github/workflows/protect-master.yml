name: Apply Master Branch Protection

# ─────────────────────────────────────────────────────────────────────────────
# Run this workflow ONCE (manually) after adding the GH_PAT secret, or whenever
# you need to re-apply the branch protection rules (e.g. after repo migration).
#
# What it enforces on `master`:
#   • Direct pushes are blocked — changes must arrive via Pull Request.
#   • PR must have at least 1 approving review.
#   • The CI status check must pass (controlled by the `ci_job_name` input below).
#   • Force-pushes are disabled.
#   • Branch cannot be deleted.
#   • Rules apply to admins too (dismisses the "I'm an admin" bypass loophole).
#
# HOW THE CHECK NAME WORKS:
#   This workflow uses the modern `checks` API (not the deprecated `contexts` API).
#   The `checks` API accepts an optional `app_id` alongside the check name, which
#   pins the rule to a specific GitHub App — eliminating the fragile exact-string
#   matching problem of the legacy approach.
#
#   app_id 15368 = GitHub Actions (fixed, permanent ID assigned by GitHub).
#   See: https://api.github.com/apps/github-actions
#
#   The check name GitHub records for Actions jobs is:
#     "<workflow name:> / <job-id>"
#   For this repo: ci.yml has `name: CI` and `jobs: check:` → "CI / check"
#
#   If you rename the CI workflow or job, update the default below and re-run.
#
# The GH_PAT secret must be a fine-grained personal access token with:
#   • Repository permission: Administration → Read & Write
#   (that's the only permission needed — Contents is NOT required for branch protection)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      ci_job_name:
        description: >
          The check name GitHub Actions records for the required CI job.
          Format: "<workflow name:> / <job-id>" — e.g. if ci.yml has `name: CI`
          and `jobs: check:`, the value is "CI / check".
          The check is pinned to app_id 15368 (GitHub Actions) so only Actions
          results count, regardless of other apps using the same name.
          To verify: Settings → Branches → Edit master → Require status checks.
        required: true
        default: "CI / check"   # <── "<ci.yml name:> / <ci.yml jobs key>"

jobs:
  protect:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only needs to read; Administration API uses the PAT

    env:
      CI_JOB_NAME: ${{ github.event.inputs.ci_job_name }}
      # GitHub Actions app ID — fixed, permanent value assigned by GitHub.
      # Verified via: curl https://api.github.com/apps/github-actions | jq .id
      GITHUB_ACTIONS_APP_ID: 15368

    steps:
      - name: Apply branch protection to master
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "Applying branch protection — required status check: '$CI_JOB_NAME' (app_id: $GITHUB_ACTIONS_APP_ID)"

          TMPFILE=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$TMPFILE" -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/branches/master/protection" \
            -d "{
              \"required_status_checks\": {
                \"strict\": true,
                \"checks\": [
                  {
                    \"context\": \"$CI_JOB_NAME\",
                    \"app_id\": $GITHUB_ACTIONS_APP_ID
                  }
                ]
              },
              \"enforce_admins\": true,
              \"required_pull_request_reviews\": {
                \"dismiss_stale_reviews\": true,
                \"require_code_owner_reviews\": false,
                \"required_approving_review_count\": 1
              },
              \"restrictions\": null,
              \"allow_force_pushes\": false,
              \"allow_deletions\": false,
              \"block_creations\": false,
              \"required_conversation_resolution\": true,
              \"lock_branch\": false
            }")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GitHub API returned HTTP $HTTP_STATUS. Check your GH_PAT permissions."
            echo "Response body:"
            cat "$TMPFILE"
            rm -f "$TMPFILE"
            exit 1
          fi
          rm -f "$TMPFILE"
          echo "✅ Branch protection applied to master (HTTP $HTTP_STATUS, check: '$CI_JOB_NAME')"
