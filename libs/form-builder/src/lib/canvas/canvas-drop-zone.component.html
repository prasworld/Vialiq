<div
      #dropZone
      class="drop-zone"
      [class.is-drag-over]="isDragOver()"
      [class.horizontal]="orientation() === 'horizontal'"
      [class.expand-to-fill]="expandToFill()">

      
      <!-- The indicator is visually hidden by CSS when not dragging. 
           Avoiding @if here prevents a massive synchronous DOM removal 
           bottleneck across all 50+ drop zones when a drag ends. -->
      <div class="indicator"></div>
    </div>
