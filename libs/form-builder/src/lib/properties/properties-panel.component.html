<div class="properties-panel">
      <!-- When NO node is selected -->
      @if (!activeNodeId()) {
        <vi-form-settings-panel
          [schema]="schema()">
        </vi-form-settings-panel>
      }
    
      <!-- When A node IS selected -->
      @if (activeNodeId() && activeNode() && activeDescriptor()) {
        <div class="node-settings">
          <div class="panel-header">
            <h3>{{ activeDescriptor()?.label }} Settings</h3>
            <button class="close-btn" (click)="closeSettings()" title="Close Settings">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="panel-content">
            @if (activeNode() && activeDescriptor()) {
              <vi-settings-host
                [schema]="activeNode()!"
                [descriptor]="activeDescriptor()!"
                (schemaChange)="onSchemaChange($event)">
              </vi-settings-host>
            }
          </div>
        </div>
      }
    
      <!-- Edge case: node ID exists but node not found (e.g. just deleted) -->
      @if (activeNodeId() && !activeNode()) {
        <div class="node-settings empty">
          <p>Component not found.</p>
        </div>
      }
    </div>
