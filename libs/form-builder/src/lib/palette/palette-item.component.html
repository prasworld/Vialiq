<div #dragHandle class="palette-item" [class.dragging]="isDragging()">
  @if (descriptor().type === 'regex') {
    <div class="ribbon-wrapper">
      <div class="ribbon">NEW</div>
    </div>
  }
  <div class="icon-container" [ngStyle]="{'color': getIconColor()}">
    <vi-icon [name]="descriptor().icon"></vi-icon>
  </div>
  <span class="label">{{ descriptor().label }}</span>
</div>
